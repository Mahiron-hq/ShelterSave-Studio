# Sample nginx site for ShelterSave-Studio. Put it into /etc/nginx/sites-available/
# and set your certificate paths. The application itself sends the security
# headers (CSP, HSTS and others), so they are not repeated here.

# Access log without visitor addresses and User-Agent strings.
log_format shelter_anon '[$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

# At most 2 statistics events per second per address, with a small burst.
limit_req_zone $binary_remote_addr zone=shelter_hit:1m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name shelter.mahiron.online;
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shelter.mahiron.online;

    ssl_certificate     /etc/letsencrypt/live/shelter.mahiron.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shelter.mahiron.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:shelter:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/shelter.access.log shelter_anon;
    error_log  /var/log/nginx/shelter.error.log warn;

    server_tokens off;
    client_max_body_size 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;

    # Files are already compressed by the application.
    gzip off;

    location = /api/hit {
        limit_req zone=shelter_hit burst=10 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        return 404;
    }

    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
