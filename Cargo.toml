[workspace]
resolver = "2"
members = ["crates/core", "crates/art", "crates/wasm", "apps/desktop", "apps/site", "apps/installer"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Lev Burmistrov (Mahiron-hq) <Mahiron.HQ@protonmail.com>"]
repository = "https://github.com/Mahiron-hq/ShelterSave-Studio"
homepage = "https://shelter.mahiron.online"
rust-version = "1.95"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.wasm]
inherits = "release"
opt-level = "z"
strip = false
