[workspace]
resolver = "2"
members = ["crates/core", "apps/desktop"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Lev Burmistrov (Mahiron-hq) <Mahiron.HQ@protonmail.com>"]
repository = "https://github.com/Mahiron-hq/ShelterSave-Studio"
homepage = "https://shelter.mahiron.online"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
