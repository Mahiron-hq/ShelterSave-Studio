[package]
name = "shelter-save-studio"
description = "ShelterSave-Studio: save editor for Fallout Shelter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

build = "build.rs"

[[bin]]
name = "shelter-save-studio"
path = "src/main.rs"

[dependencies]
shelter-core = { path = "../../crates/core" }
shelter-art = { path = "../../crates/art" }
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit", "clipboard", "links", "wayland", "x11"] }
rfd = "0.18"
sys-locale = "0.3"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.2"

[build-dependencies]
winresource = "0.1"

[package.metadata.deb]
name = "shelter-save-studio"
maintainer = "Lev Burmistrov (Mahiron-hq) <Mahiron.HQ@protonmail.com>"
copyright = "2026, Lev Burmistrov (Mahiron-hq)"
license-file = ["../../LICENSE", "0"]
extended-description = "Editor for Fallout Shelter save files. Works offline."
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/shelter-save-studio", "usr/bin/", "755"],
    ["../../packaging/linux/shelter-save-studio.desktop", "usr/share/applications/", "644"],
    ["../../assets/app-icon.png", "usr/share/icons/hicolor/256x256/apps/shelter-save-studio.png", "644"],
]

[package.metadata.generate-rpm]
name = "shelter-save-studio"
summary = "Editor for Fallout Shelter save files"
assets = [
    { source = "target/release/shelter-save-studio", dest = "/usr/bin/shelter-save-studio", mode = "755" },
    { source = "../../packaging/linux/shelter-save-studio.desktop", dest = "/usr/share/applications/shelter-save-studio.desktop", mode = "644" },
    { source = "../../assets/app-icon.png", dest = "/usr/share/icons/hicolor/256x256/apps/shelter-save-studio.png", mode = "644" },
]
