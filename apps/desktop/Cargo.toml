[package]
name = "shelter-save-studio"
description = "ShelterSave-Studio: save editor for Fallout Shelter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "shelter-save-studio"
path = "src/main.rs"

[dependencies]
shelter-core = { path = "../../crates/core" }
shelter-art = { path = "../../crates/art" }
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit", "clipboard", "links", "wayland", "x11"] }
rfd = "0.18"
sys-locale = "0.3"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
