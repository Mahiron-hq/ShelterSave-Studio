[package]
name = "shelter-save-studio-setup"
description = "ShelterSave-Studio setup for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "shelter-save-studio-setup"
path = "src/main.rs"

[dependencies]
shelter-core = { path = "../../crates/core" }
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
rfd = "0.18"
winreg = "0.56"
mslnk = "0.1"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1"
