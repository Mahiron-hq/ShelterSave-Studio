[package]
name = "shelter-site"
description = "ShelterSave-Studio website server, anonymous visit counter, watchdog and Telegram bot"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "shelter-site"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
include_dir = "0.7"
redb = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = "0.11"
getrandom = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
x509-parser = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
